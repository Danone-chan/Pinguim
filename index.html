<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards de Pinguins</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🐧 Quiz dos Pinguins 🧊</h1>
        <div class="flashcard-container">
            <div class="flashcard" id="flashcard">
                <div class="front">
                    <h2 id="question">Carregando pergunta...</h2>
                    <p class="hint">Clique na carta para ver a resposta!</p>
                </div>
                <div class="back">
                    <h2 id="answer">Carregando resposta...</h2>
                </div>
            </div>
        </div>
        <div class="controls">
            <button id="btn-prev">Anterior</button>
            <button id="btn-next">Próxima</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
